apiVersion: apps/v1
kind: Deployment
metadata:
  name: kis-trading-api
  namespace: trading-system
  labels:
    app: kis-trading
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kis-trading
      component: api
  template:
    metadata:
      labels:
        app: kis-trading
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: kis-trading/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: KIS_APP_KEY
          valueFrom:
            secretKeyRef:
              name: kis-secrets
              key: KIS_APP_KEY
        - name: KIS_APP_SECRET
          valueFrom:
            secretKeyRef:
              name: kis-secrets
              key: KIS_APP_SECRET
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: REDIS_PASSWORD
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: JWT_SECRET_KEY
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: ENCRYPTION_KEY
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: models
          mountPath: /app/models
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: kis-trading-logs-pvc
      - name: models
        persistentVolumeClaim:
          claimName: kis-trading-models-pvc
      - name: tmp
        emptyDir: {}
      nodeSelector:
        nodeType: trading
      tolerations:
      - key: "trading-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - kis-trading
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: kis-trading-api-service
  namespace: trading-system
  labels:
    app: kis-trading
    component: api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: kis-trading
    component: api

---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: kis-trading-api-monitor
  namespace: trading-system
  labels:
    app: kis-trading
    component: api
spec:
  selector:
    matchLabels:
      app: kis-trading
      component: api
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s